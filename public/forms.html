<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Milestone 코칭 일지 · 설문 · 완료보고서 웹앱</title>
  <style>
    :root {
      --primary: #1B4965;
      --primary-dark: #123347;
      --primary-soft: #EBF2F7;
      --accent: #B86B1B;
      --bg: #F4F7F9;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text-main: #0F172A;
      --text-body: #334155;
      --text-muted: #64748B;
      --emerald: #059669;
      --emerald-soft: #D1FAE5;
      --rose: #E11D48;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .hidden { display: none !important; }

    /* Header & Nav */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .header-inner {
      max-width: 1024px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--accent); text-transform: uppercase;
    }
    .brand-title {
      margin: 0; font-size: 16px; font-weight: 700; color: var(--primary-dark);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-wrap {
      max-width: 1024px;
      margin: 0 auto;
      padding: 0 16px 12px;
      overflow-x: auto;
    }
    .nav-list { display: flex; align-items: center; gap: 8px; min-width: max-content; }
    .tab-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-body);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .tab-btn:hover { background: #F8FAFC; }
    .tab-btn[aria-selected="true"] {
      background-color: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    /* Main Container */
    .main-wrap {
      flex: 1;
      max-width: 896px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .card {
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .banner-card { overflow: hidden; margin-bottom: 20px; }
    .banner-bar {
      height: 10px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
    }
    .banner-bar-success { height: 10px; background: var(--emerald); }
    .card-pad { padding: 20px; }
    .meta-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 8px;
    }
    .badge {
      display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 9999px;
      font-size: 12px; font-weight: 600; background: var(--primary-soft); color: var(--primary);
    }
    .req-note { font-size: 12px; color: var(--text-muted); }
    .req-star { color: var(--rose); font-weight: 700; }
    .form-title { margin: 0 0 8px; font-size: 21px; font-weight: 700; color: var(--primary-dark); }
    .form-desc { margin: 0; font-size: 14px; color: var(--text-body); white-space: pre-line; line-height: 1.6; }

    /* Form Fields */
    .stack-5 { display: flex; flex-direction: column; gap: 20px; }
    .stack-4 { display: flex; flex-direction: column; gap: 16px; }
    .stack-3 { display: flex; flex-direction: column; gap: 12px; }
    .section-title {
      margin: 0 0 16px; padding-bottom: 10px;
      border-bottom: 1px solid #F1F5F9;
      font-size: 16px; font-weight: 700; color: var(--primary);
    }
    .field-label { display: block; font-size: 14px; font-weight: 600; color: #1E293B; margin-bottom: 4px; }
    .field-hint { margin: 0 0 8px; font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .input-ctrl {
      width: 100%; padding: 10px 14px; font-size: 14px;
      border-radius: 8px; border: 1px solid var(--border-strong);
      background: #FFFFFF; color: var(--text-main);
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-ctrl:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(27, 73, 101, 0.16);
    }
    textarea.input-ctrl { resize: vertical; line-height: 1.6; }

    .radio-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .radio-card { display: block; cursor: pointer; }
    .radio-card-box {
      padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
      font-size: 14px; color: var(--text-body);
      display: flex; align-items: center; gap: 10px; transition: all 0.15s;
    }
    .radio-card-box:hover { background: #F8FAFC; }
    .radio-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 1.5px solid #94A3B8; flex-shrink: 0; position: relative;
    }
    .radio-card input:checked + .radio-card-box {
      background-color: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-dark);
      font-weight: 600;
    }
    .radio-card input:checked + .radio-card-box .radio-dot {
      border-color: var(--primary);
      background: radial-gradient(circle, var(--primary) 45%, transparent 50%);
    }

    .inline-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .likert-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .likert-option { cursor: pointer; text-align: center; }
    .likert-pill {
      display: inline-block; padding: 8px 14px; border-radius: 8px;
      border: 1px solid var(--border); font-size: 13px; color: var(--text-body);
      transition: all 0.15s;
    }
    .likert-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 10px 8px; border-radius: 8px;
      border: 1px solid var(--border); font-size: 12px; color: var(--text-body);
      transition: all 0.15s;
    }
    .likert-pill:hover, .likert-box:hover { background: #F8FAFC; }
    .likert-score { font-size: 11px; opacity: 0.75; margin-bottom: 2px; font-weight: 700; }
    .likert-option input:checked + span {
      background-color: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      font-weight: 600;
    }
    .field-error { margin: 6px 0 0; font-size: 12px; color: var(--rose); font-weight: 600; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-body);
      transition: background-color 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #F8FAFC; }
    .btn-primary {
      background: var(--primary); border-color: var(--primary); color: #FFFFFF;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-emerald {
      background: var(--emerald); border-color: var(--emerald); color: #FFFFFF;
    }
    .btn-emerald:hover { background: #047857; border-color: #047857; }
    .btn-soft { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
    .btn-soft:hover { background: #DCE8F0; }
    .btn-danger { background: var(--rose); border-color: var(--rose); color: #FFFFFF; }
    .btn-danger:hover { background: #BE123C; }
    .btn-danger-outline { border-color: #FECDD3; color: var(--rose); background: #FFFFFF; }
    .btn-danger-outline:hover { background: #FFF1F2; }

    .action-bar {
      padding: 16px 20px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }
    .btn-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .count-pill {
      padding: 2px 7px; border-radius: 9999px; font-size: 12px; font-weight: 700;
      background: var(--primary-soft); color: var(--primary);
    }

    /* Result & History */
    .result-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .result-icon {
      width: 40px; height: 40px; border-radius: 9999px;
      background: var(--emerald-soft); color: #047857;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .result-actions {
      display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px;
      border-top: 1px solid #F1F5F9;
    }
    .summary-item { border-bottom: 1px solid #F1F5F9; padding-bottom: 10px; }
    .summary-item:last-child { border-bottom: 0; }
    .summary-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
    .summary-val { font-size: 14px; color: var(--text-main); white-space: pre-line; }
    .history-card {
      padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 12px;
    }

    /* Toast & Modal */
    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 50;
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; border-radius: 12px;
      background: var(--primary-dark); color: #FFFFFF;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
    }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: rgba(15, 23, 42, 0.5); padding: 16px;
    }
    .modal-box {
      background: var(--surface); border-radius: 12px;
      max-width: 380px; width: 100%; padding: 20px;
      border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
    }

    @media (min-width: 640px) {
      .header-inner { padding: 12px 24px; }
      .nav-wrap { padding: 0 24px 12px; }
      .main-wrap { padding: 24px; }
      .card-pad { padding: 24px; }
      .brand-title { font-size: 18px; }
      .form-title { font-size: 24px; }
      .likert-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }
    @media print {
      header, nav, .no-print { display: none !important; }
      body { background: #FFFFFF !important; }
      .main-wrap { max-width: 100% !important; padding: 0 !important; }
      .print-card { box-shadow: none !important; border: 1px solid #CBD5E1 !important; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-row">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6H5a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h13l4-3.5L18 6Z"/><path d="M12 13v8"/><path d="M12 3v3"/></svg>
        </div>
        <div style="min-width:0">
          <div class="brand-eyebrow">Dream Milestone · SCC</div>
          <h1 class="brand-title">코칭 일지 · 종료 설문 · 완료 보고서</h1>
        </div>
      </div>

      <div class="btn-group">
        <button id="btn-toggle-history" type="button" class="btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B4965" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          <span>작성 기록</span>
          <span id="history-count" class="count-pill">0</span>
        </button>
      </div>
    </div>

    <!-- Form Switcher Navigation -->
    <nav class="nav-wrap">
      <div class="nav-list" role="tablist" aria-label="양식 선택">
        <button type="button" role="tab" data-form="coaching_log" aria-selected="true" class="tab-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg>
          <span>1. 회차별 코칭 일지</span>
        </button>
        <button type="button" role="tab" data-form="survey_mentee" aria-selected="false" class="tab-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
          <span>2. 종료 설문 (멘티/고객용)</span>
        </button>
        <button type="button" role="tab" data-form="survey_coach" aria-selected="false" class="tab-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
          <span>3. 종료 설문 (코치/멘토용)</span>
        </button>
        <button type="button" role="tab" data-form="completion_report" aria-selected="false" class="tab-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m3 15 2 2 4-4"/></svg>
          <span>4. 코칭 완료 보고서</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="main-wrap">
    <!-- Toast Notification -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      <span id="toast-msg">처리되었습니다.</span>
    </div>

    <!-- Active Form Container -->
    <div id="form-view">
      <!-- Form Header Banner -->
      <div class="card banner-card print-card">
        <div class="banner-bar"></div>
        <div class="card-pad">
          <div class="meta-row">
            <span id="form-badge" class="badge"></span>
            <span class="req-note"><span class="req-star">*</span> 필수 입력 항목</span>
          </div>
          <h2 id="form-title" class="form-title"></h2>
          <p id="form-desc" class="form-desc"></p>
        </div>
      </div>

      <!-- Dynamic Form Body -->
      <form id="dynamic-form" novalidate class="stack-5">
        <div id="form-sections" class="stack-5"></div>

        <!-- Action Bar -->
        <div class="no-print card action-bar">
          <div class="btn-group">
            <button id="btn-reset" type="button" class="btn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>초기화</span>
            </button>
            <button id="btn-save-draft" type="button" class="btn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1B4965" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
              <span>임시저장</span>
            </button>
          </div>
          <div class="btn-group">
            <button id="btn-download-png-direct" type="button" class="btn btn-primary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/><path d="m14 19 3 3 3-3"/><path d="M17 22v-6"/><circle cx="9" cy="9" r="2"/></svg>
              <span>PNG 이미지 저장</span>
            </button>
            <button id="btn-submit-form" type="submit" class="btn btn-emerald">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
              <span>작성 완료 · 저장</span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Submission Result View -->
    <div id="result-view" class="hidden stack-5">
      <div class="card" style="overflow:hidden">
        <div class="banner-bar-success"></div>
        <div class="card-pad">
          <div class="result-head">
            <div class="result-icon" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <div>
              <h2 id="result-title" style="margin:0;font-size:19px;font-weight:700;color:#0F172A">제출이 완료되었습니다</h2>
              <p id="result-message" style="margin:4px 0 0;font-size:14px;color:#475569;line-height:1.6"></p>
            </div>
          </div>

          <div class="result-actions">
            <button id="btn-result-png" type="button" class="btn btn-primary">
              <span>PNG 카드 다운로드</span>
            </button>
            <button id="btn-result-copy" type="button" class="btn">
              <span>내용 텍스트 복사</span>
            </button>
            <button id="btn-result-print" type="button" class="btn">
              <span>인쇄 / PDF 저장</span>
            </button>
            <button id="btn-back-to-form" type="button" class="btn btn-soft" style="margin-left:auto">
              <span>← 양식으로 돌아가기</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Summary Preview Card -->
      <div class="card card-pad print-card">
        <h3 style="margin:0 0 14px;font-size:12px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:0.05em">작성 내용 요약</h3>
        <div id="result-summary" class="stack-3"></div>
      </div>
    </div>

    <!-- History View -->
    <div id="history-view" class="hidden stack-4">
      <div class="card history-card">
        <div>
          <h2 style="margin:0;font-size:18px;font-weight:700;color:var(--primary-dark)">작성 및 제출 기록</h2>
          <p style="margin:4px 0 0;font-size:12px;color:var(--text-muted)">이 브라우저에 저장된 제출 내역입니다. PNG로 저장하거나 상세 내용을 확인할 수 있습니다.</p>
        </div>
        <div class="btn-group">
          <button id="btn-export-json" type="button" class="btn">
            <span>JSON 내보내기</span>
          </button>
          <button id="btn-close-history" type="button" class="btn btn-primary">
            양식으로 돌아가기
          </button>
        </div>
      </div>
      <div id="history-list" class="stack-3"></div>
    </div>
  </main>

  <!-- In-page Reset Confirmation Modal -->
  <div id="reset-modal" class="modal-backdrop hidden">
    <div class="modal-box">

          {
            title: "섹션 3. 향후 계획 및 최종 제출 확인",
            fields: [
              {
                id: "futurePlan",
                label: "코칭 종결 후 계획 및 제언",
                type: "textarea",
                required: false,
                hint: "코칭 종료 후 고객이 스스로 성장을 이어가기 위해 수립한 사후 실행 계획(Follow-up Plan)이나, 향후 코칭 프로그램의 발전을 위한 코치님의 제언을 적어주세요.",
                placeholder: "사후 실행 계획 및 프로그램 발전 제언을 작성하세요."

              { id: "submitDate", label: "보고서 제출일자", type: "date", required: true },
              { id: "signature", label: "작성자 확인 및 전자 서명", type: "text", required: true, hint: "위와 같이 코칭 프로그램의 코칭 완료 보고서를 제출하며, 작성된 내용이 사실과 같음을 확인합니다. 아래에 코치님의 성함을 다시 한번 기입하여 서명을 갈음합니다. (예: 홍길동 (서명))", placeholder: "예: 홍길동 (서명)" }
            ]

    };

    const STORAGE_DRAFT_PREFIX = "dm_form_draft_v1_";
    const STORAGE_HISTORY_KEY = "dm_form_history_v1";
    const memoryStorage = {};

    let activeFormId = "coaching_log";
    let lastSubmittedRecord = null;

    function safeGetStorage(key) {
      try { return localStorage.getItem(key); } catch (e) { return memoryStorage[key] || null; }
    }
    function safeSetStorage(key, val) {
      memoryStorage[key] = val;
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add("hidden");
      }, 2600);
    }

    function getHistory() {
      try {
        const raw = safeGetStorage(STORAGE_HISTORY_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function updateHistoryCount() {
      document.getElementById("history-count").textContent = String(getHistory().length);
    }

    function getUrlPrefill() {
      const params = new URLSearchParams(window.location.search);
      return {
        form: params.get("form"),
        round: params.get("round"),
        programName: params.get("program") || params.get("programName"),
        programId: params.get("programId"),
        clientCode: params.get("clientCode")
      };
    }

    function getDraft(formId) {
      try {
        const raw = safeGetStorage(STORAGE_DRAFT_PREFIX + formId);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderForm(formId) {
      activeFormId = formId;
      const spec = FORMS[formId];
      const draft = getDraft(formId);
      const prefill = getUrlPrefill();

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.setAttribute("aria-selected", btn.dataset.form === formId ? "true" : "false");
      });

      document.getElementById("form-badge").textContent = spec.badge;
      document.getElementById("form-title").textContent = spec.title;
      document.getElementById("form-desc").textContent = spec.description;

      const container = document.getElementById("form-sections");
      container.innerHTML = "";

      spec.sections.forEach(sec => {
        const card = document.createElement("div");
        card.className = "card card-pad print-card";
        let html = `<h3 class="section-title">${escapeHtml(sec.title)}</h3><div class="stack-5">`;

        sec.fields.forEach(field => {
          let val = draft[field.id];
          if (field.id === "sessionRound" && prefill.round && field.options) {
            const idx = Number(prefill.round) - 1;
            if (idx >= 0 && idx < field.options.length) {
              val = field.options[idx];
            }
          }
          if (val === undefined) {
            if (prefill[field.id]) val = prefill[field.id];
            else if (field.defaultValue) val = field.defaultValue;
            else if (field.type === "date") val = new Date().toISOString().slice(0, 10);
            else val = "";
          }

          html += `<div class="field-group" data-field-id="${field.id}">`;
          html += `<label class="field-label">${escapeHtml(field.label)}${field.required ? ' <span class="req-star">*</span>' : ''}</label>`;
          if (field.hint) {
            html += `<p class="field-hint">${escapeHtml(field.hint)}</p>`;
          }

          if (field.type === "text" || field.type === "date") {
            html += `<input type="${field.type}" name="${field.id}" value="${escapeHtml(val)}" placeholder="${escapeHtml(field.placeholder || "")}" class="input-ctrl">`;
          } else if (field.type === "textarea") {
            html += `<textarea name="${field.id}" rows="4" placeholder="${escapeHtml(field.placeholder || "")}" class="input-ctrl">${escapeHtml(val)}</textarea>`;
          } else if (field.type === "radio") {
            html += `<div class="radio-stack">`;
            field.options.forEach(opt => {
              const checked = val === opt ? "checked" : "";
              html += `
                <label class="radio-card">
                  <input type="radio" name="${field.id}" value="${escapeHtml(opt)}" ${checked} class="sr-only">
                  <div class="radio-card-box">
                    <span class="radio-dot"></span>
                    <span>${escapeHtml(opt)}</span>
                  </div>
                </label>`;
            });
            html += `</div>`;
          } else if (field.type === "radio_inline") {
            html += `<div class="inline-options">`;
            field.options.forEach(opt => {
              const checked = val === opt ? "checked" : "";
              html += `
                <label class="likert-option">
                  <input type="radio" name="${field.id}" value="${escapeHtml(opt)}" ${checked} class="sr-only">
                  <span class="likert-pill">${escapeHtml(opt)}</span>
                </label>`;
            });
            html += `</div>`;
          } else if (field.type === "likert") {
            html += `<div class="likert-grid">`;
            field.options.forEach((opt, idx) => {
              const checked = val === opt ? "checked" : "";
              html += `
                <label class="likert-option">
                  <input type="radio" name="${field.id}" value="${escapeHtml(opt)}" ${checked} class="sr-only">
                  <span class="likert-box">
                    <b class="likert-score">${idx + 1}점</b>
                    <span>${escapeHtml(opt)}</span>
                  </span>
                </label>`;
            });
            html += `</div>`;
          }

          html += `<p class="field-error hidden">필수 항목을 입력(선택)해 주세요.</p>`;
          html += `</div>`;
        });

        html += `</div>`;
        card.innerHTML = html;
        container.appendChild(card);
      });

      document.getElementById("form-view").classList.remove("hidden");
      document.getElementById("result-view").classList.add("hidden");
      document.getElementById("history-view").classList.add("hidden");
    }

    function collectFormData() {
      const spec = FORMS[activeFormId];
      const formEl = document.getElementById("dynamic-form");
      const data = {};
      let valid = true;
      let firstInvalidEl = null;

      spec.sections.forEach(sec => {
        sec.fields.forEach(field => {
          const group = formEl.querySelector(`.field-group[data-field-id="${field.id}"]`);
          const errEl = group.querySelector(".field-error");
          let value = "";
          if (field.type === "radio" || field.type === "radio_inline" || field.type === "likert") {
            const checked = formEl.querySelector(`input[name="${field.id}"]:checked`);
            value = checked ? checked.value : "";
          } else {
            const input = formEl.querySelector(`[name="${field.id}"]`);
            value = input ? input.value.trim() : "";
          }
          data[field.id] = value;

          if (field.required && !value) {
            valid = false;
            errEl.classList.remove("hidden");
            if (!firstInvalidEl) firstInvalidEl = group;
          } else {
            errEl.classList.add("hidden");
          }
        });
      });

      return { valid, data, firstInvalidEl };
    }

    function saveDraftCurrent() {
      const { data } = collectFormData();
      safeSetStorage(STORAGE_DRAFT_PREFIX + activeFormId, JSON.stringify(data));
      showToast("현재 작성 내용이 임시저장되었습니다.");
    }

    function buildRecord(data) {
      const spec = FORMS[activeFormId];
      const items = [];
      spec.sections.forEach(sec => {
        sec.fields.forEach(f => {
          items.push({ label: f.label, value: data[f.id] || "(미입력)" });
        });
      });
      return {
        uid: "rec_" + Date.now(),
        formId: activeFormId,
        formTitle: spec.title,
        completionMsg: spec.completionMsg,
        createdAt: new Date().toLocaleString("ko-KR"),
        data,
        items
      };
    }

    function showResultView(record) {
      lastSubmittedRecord = record;
      document.getElementById("result-title").textContent = `${record.formTitle} — 제출 완료`;
      document.getElementById("result-message").textContent = record.completionMsg;

      const summaryEl = document.getElementById("result-summary");
      summaryEl.innerHTML = record.items.map(it => `
        <div class="summary-item">
          <div class="summary-label">${escapeHtml(it.label)}</div>
          <div class="summary-val">${escapeHtml(it.value)}</div>
        </div>
      `).join("");

      document.getElementById("form-view").classList.add("hidden");
      document.getElementById("history-view").classList.add("hidden");
      document.getElementById("result-view").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function wrapCanvasLines(ctx, text, maxWidth) {
      const paragraphs = String(text || "").split("\n");
      const lines = [];
      paragraphs.forEach(p => {
        if (!p) { lines.push(""); return; }
        let line = "";
        for (let i = 0; i < p.length; i++) {
          const test = line + p[i];
          if (ctx.measureText(test).width > maxWidth && line.length > 0) {
            lines.push(line);
            line = p[i];
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
      });
      return lines;
    }

    function downloadRecordAsPng(record) {
      const width = 900;
      const padX = 48;
      const contentW = width - padX * 2;
      const tempCanvas = document.createElement("canvas");
      const tctx = tempCanvas.getContext("2d");

      let y = 140;
      record.items.forEach(it => {
        tctx.font = "600 15px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
        const lLines = wrapCanvasLines(tctx, it.label, contentW - 24);
        tctx.font = "400 17px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
        const vLines = wrapCanvasLines(tctx, it.value, contentW - 24);
        y += lLines.length * 22 + vLines.length * 26 + 34;
      });
      const height = Math.max(460, y + 60);

      const scale = 2;
      const canvas = document.createElement("canvas");
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "#1B4965";
      ctx.fillRect(0, 0, width, 108);
      ctx.fillStyle = "#B86B1B";
      ctx.fillRect(0, 104, width, 5);

      ctx.fillStyle = "#FDE68A";
      ctx.font = "700 13px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
      ctx.fillText("DREAM MILESTONE · SCC COACHING PORTAL", padX, 36);

      ctx.fillStyle = "#FFFFFF";
      ctx.font = "700 23px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
      ctx.fillText(record.formTitle, padX, 70);

      ctx.fillStyle = "#CBD5E1";
      ctx.font = "400 13px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
      ctx.fillText(`작성 일시: ${record.createdAt}`, padX, 92);

      let curY = 136;
      record.items.forEach((it, idx) => {
        ctx.font = "600 15px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
        const lLines = wrapCanvasLines(ctx, it.label, contentW - 24);
        ctx.font = "400 17px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
        const vLines = wrapCanvasLines(ctx, it.value, contentW - 24);
        const boxH = lLines.length * 22 + vLines.length * 26 + 22;

        ctx.fillStyle = idx % 2 === 0 ? "#F8FAFC" : "#FFFFFF";
        ctx.fillRect(padX, curY, contentW, boxH);
        ctx.strokeStyle = "#E2E8F0";
        ctx.strokeRect(padX, curY, contentW, boxH);

        let ty = curY + 24;
        ctx.fillStyle = "#1B4965";
        ctx.font = "700 14px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
        lLines.forEach(line => {
          ctx.fillText(line, padX + 14, ty);
          ty += 22;
        });

        ty += 4;
        ctx.fillStyle = "#1E293B";
        ctx.font = "400 16px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
        vLines.forEach(line => {
          ctx.fillText(line, padX + 14, ty);
          ty += 26;
        });

        curY += boxH + 10;
      });

      ctx.fillStyle = "#64748B";
      ctx.font = "400 12px 'Noto Sans KR', 'Malgun Gothic', sans-serif";
      ctx.fillText("한국코치협회 인증코치 · Dream Milestone 5회기 커리어 코칭 프로그램", padX, height - 22);

      const link = document.createElement("a");
      link.download = `${record.formId}_${Date.now()}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
      showToast("PNG 카드 이미지가 저장되었습니다.");
    }

    function copyRecordText(record) {
      const lines = [`[${record.formTitle}] (${record.createdAt})`, ""];
      record.items.forEach(it => {
        lines.push(`■ ${it.label}`);
        lines.push(it.value);
        lines.push("");
      });
      const text = lines.join("\n");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("작성 내용이 클립보드에 복사되었습니다."))
          .catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("작성 내용이 클립보드에 복사되었습니다.");
      } catch (e) {
        showToast("복사에 실패했습니다.");
      }
      document.body.removeChild(ta);
    }

    function renderHistoryView() {
      const list = getHistory();
      const container = document.getElementById("history-list");
      if (list.length === 0) {
        container.innerHTML = `
          <div class="card card-pad" style="text-align:center;font-size:14px;color:var(--text-muted)">
            아직 저장된 제출 기록이 없습니다. 양식을 작성하고 저장해 보세요.
          </div>`;
      } else {
        container.innerHTML = list.map((rec, idx) => `
          <div class="card history-card">
            <div>
              <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(rec.createdAt)}</div>
              <div style="font-size:15px;font-weight:700;color:var(--primary-dark);margin-top:2px">${escapeHtml(rec.formTitle)}</div>
              <div style="font-size:12px;color:var(--text-body);margin-top:4px">${escapeHtml(rec.items.slice(0, 2).map(i => i.value).join(" · "))}</div>
            </div>
            <div class="btn-group">
              <button type="button" data-action="png" data-idx="${idx}" class="btn btn-soft">PNG 저장</button>
              <button type="button" data-action="view" data-idx="${idx}" class="btn">상세 보기</button>
              <button type="button" data-action="delete" data-idx="${idx}" class="btn btn-danger-outline">삭제</button>
            </div>
          </div>
        `).join("");
      }

      document.getElementById("form-view").classList.add("hidden");
      document.getElementById("result-view").classList.add("hidden");
      document.getElementById("history-view").classList.remove("hidden");
    }

    // Event Listeners
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => renderForm(btn.dataset.form));
    });

    document.getElementById("dynamic-form").addEventListener("submit", e => {
      e.preventDefault();
      const { valid, data, firstInvalidEl } = collectFormData();
      if (!valid) {
        firstInvalidEl.scrollIntoView({ behavior: "smooth", block: "center" });
        showToast("필수 입력 항목을 확인해 주세요.");
        return;
      }
      safeSetStorage(STORAGE_DRAFT_PREFIX + activeFormId, JSON.stringify(data));
      const record = buildRecord(data);
      const history = getHistory();
      history.unshift(record);
      safeSetStorage(STORAGE_HISTORY_KEY, JSON.stringify(history));
      updateHistoryCount();
      showResultView(record);
    });

    document.getElementById("btn-save-draft").addEventListener("click", saveDraftCurrent);

    document.getElementById("btn-download-png-direct").addEventListener("click", () => {
      const { data } = collectFormData();
      const record = buildRecord(data);
      downloadRecordAsPng(record);
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      document.getElementById("reset-modal").classList.remove("hidden");
    });

    document.getElementById("btn-cancel-reset").addEventListener("click", () => {
      document.getElementById("reset-modal").classList.add("hidden");
    });

    document.getElementById("btn-confirm-reset").addEventListener("click", () => {
      safeSetStorage(STORAGE_DRAFT_PREFIX + activeFormId, "");
      document.getElementById("reset-modal").classList.add("hidden");
      renderForm(activeFormId);
      showToast("양식이 초기화되었습니다.");
    });

    document.getElementById("btn-result-png").addEventListener("click", () => {
      if (lastSubmittedRecord) downloadRecordAsPng(lastSubmittedRecord);
    });
    document.getElementById("btn-result-copy").addEventListener("click", () => {
      if (lastSubmittedRecord) copyRecordText(lastSubmittedRecord);
    });
    document.getElementById("btn-result-print").addEventListener("click", () => window.print());
    document.getElementById("btn-back-to-form").addEventListener("click", () => renderForm(activeFormId));

    document.getElementById("btn-toggle-history").addEventListener("click", renderHistoryView);
    document.getElementById("btn-close-history").addEventListener("click", () => renderForm(activeFormId));

    document.getElementById("history-list").addEventListener("click", e => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const idx = Number(btn.dataset.idx);
      const history = getHistory();
      const rec = history[idx];
      if (!rec) return;
      if (btn.dataset.action === "png") downloadRecordAsPng(rec);
      else if (btn.dataset.action === "view") showResultView(rec);
      else if (btn.dataset.action === "delete") {
        history.splice(idx, 1);
        safeSetStorage(STORAGE_HISTORY_KEY, JSON.stringify(history));
        updateHistoryCount();
        renderHistoryView();
        showToast("기록이 삭제되었습니다.");
      }
    });

    document.getElementById("btn-export-json").addEventListener("click", () => {
      const dataStr = JSON.stringify(getHistory(), null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `dream_milestone_records_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("JSON 파일로 내보냈습니다.");
    });

    // Init
    (function init() {
      const prefill = getUrlPrefill();
      const initialForm = (prefill.form && FORMS[prefill.form]) ? prefill.form : "coaching_log";
      updateHistoryCount();
      renderForm(initialForm);
    })();
  </script>
</body>
</html>
